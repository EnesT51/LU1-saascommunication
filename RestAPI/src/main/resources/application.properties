spring.application.name=RestAPI

server.port=8081

app.queue.name=${ACTIVEMQ_QUEUE_NAME}

security.api-key=${API_KEY}
security.user.password=${USER_PASSWORD}

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL}
spring.activemq.user=${ACTIVEMQ_USERNAME}
spring.activemq.password=${ACTIVEMQ_PASSWORD}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.initializationFailTimeout=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Monitoring: Actuator + Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=restapi
providers.swiftsend.url=${SWIFTSEND_URL}
providers.swiftsend.api-key=${SWIFTSEND_API_KEY}
providers.swiftsend.student-group=${STUDENT_GROUP}

providers.legacylink.url=${LEGACYLINK_URL}
providers.legacylink.authorization=${LEGACYLINK_AUTHORIZATION}
providers.legacylink.sender=${LEGACYLINK_SENDER}
providers.legacylink.student-group=${STUDENT_GROUP}

providers.asyncflow.url=${ASYNCFLOW_URL}
providers.asyncflow.api-key=${ASYNCFLOW_API_KEY}
providers.asyncflow.priority=${ASYNCFLOW_PRIORITY}
providers.asyncflow.student-group=${STUDENT_GROUP}

providers.securepost.auth-url=${SECUREPOST_AUTH_URL}
providers.securepost.message-url=${SECUREPOST_MESSAGE_URL}
providers.securepost.client-id=${SECUREPOST_CLIENT_ID}
providers.securepost.client-secret=${SECUREPOST_CLIENT_SECRET}
providers.securepost.student-group=${STUDENT_GROUP}

# OrganizationId → Provider mapping
# Each hospital maps to one of the 4 providers.
# To add a new hospital: add one line below with their organizationId.
# provider.mapping.<organizationId>=<SWIFTSEND|LEGACYLINK|ASYNCFLOW|SECUREPOST>
provider.mapping.default=SWIFTSEND

provider.mapping.ziekenhuis-amsterdam=SWIFTSEND
provider.mapping.amsterdam-amc=ASYNCFLOW
provider.mapping.rotterdam-erasmus=LEGACYLINK
provider.mapping.utrecht-umcu=SECUREPOST

# Fallback provider used when primary fails 3 times
provider.fallback=LEGACYLINK

# Tijdzone per organisatie (IANA tz database IDs)
# Nieuwe organisatie toevoegen: organization.timezone.<organizationId>=<tijdzone>
organization.timezone.default=Europe/Amsterdam
organization.timezone.ziekenhuis-amsterdam=Europe/Amsterdam
organization.timezone.amsterdam-amc=Europe/Amsterdam
organization.timezone.rotterdam-erasmus=Europe/Amsterdam
organization.timezone.utrecht-umcu=Europe/Amsterdam
# Voorbeeld voor toekomstige niet-Europese organisaties:
# organization.timezone.singapore-hospital=Asia/Singapore
# organization.timezone.new-york-hospital=America/New_York
