services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    restart: "unless-stopped"
    environment:
      - SPA_PATH=/openmrs/spa
      - API_URL=/openmrs
      - SPA_CONFIG_URLS=/openmrs/spa/config-core_demo.json
      - SPA_DEFAULT_LOCALE=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - db
      - messagequeue
    environment:
      OMRS_DEV_DEBUG_PORT: "5005"
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      ACTIVEMQ_BROKER_URL: ${ACTIVEMQ_BROKER_URL}
      ACTIVEMQ_QUEUE_NAME: ${ACTIVEMQ_QUEUE_NAME}
      ACTIVEMQ_WEB_API_URL: ${ACTIVEMQ_WEB_API_URL}
      ACTIVEMQ_USERNAME: ${ACTIVEMQ_USERNAME}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/opt/certs/client.ts
        -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      - ./saascommunication/omod/target/saascommunication-1.0.0-SNAPSHOT.omod:/openmrs/data/modules/saascommunication.omod
      - ./activemq/certs:/opt/certs:ro

  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    ports:
    - "3307:3306"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: 'mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute "SHOW DATABASES;"'
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

  messagequeue:
    image: apache/activemq-classic:6.1.6
    container_name: activemq-classic-omrs
    hostname: activemq-classic-omrs
    restart: unless-stopped
    environment:
      - ACTIVEMQ_WEB_USER=${ACTIVEMQ_USERNAME}
      - ACTIVEMQ_WEB_PASSWORD=${ACTIVEMQ_PASSWORD}
    ports:
      - "8161:8161"     # Web console (beschermd met wachtwoord)
      - "61616:61616"
      - "61617:61617"   # SSL/TLS 1.3
    volumes:
      - ./activemq/conf/activemq.xml:/opt/apache-activemq/conf/activemq.xml:ro
      - ./activemq/certs:/opt/apache-activemq/certs:ro

  restapi:
    build:
      context: ./RestAPI
    restart: "unless-stopped"
    depends_on:
      - db
      - messagequeue
      - lgtm
    environment:
      API_KEY: ${API_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ACTIVEMQ_BROKER_URL: ${ACTIVEMQ_BROKER_URL}
      ACTIVEMQ_QUEUE_NAME: ${ACTIVEMQ_QUEUE_NAME}
      ACTIVEMQ_USERNAME: ${ACTIVEMQ_USERNAME}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      OTEL_SERVICE_NAME: restapi
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Djavax.net.ssl.trustStore=/opt/certs/client.ts
        -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD}
    ports:
      - "8081:8081"
      - "5006:5005"
    volumes:
      - ./activemq/certs:/opt/certs:ro

  # All-in-one observability stack: Loki + Grafana + Tempo + Mimir + OTEL Collector
  lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./monitoring/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./monitoring/grafana/dashboards/saascommunication.json:/otel-lgtm/saascommunication-dashboard.json:ro
      - ./monitoring/grafana-saascommunication-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/saascommunication.yaml:ro
    depends_on:
      - json-exporter

  # Converts ActiveMQ Jolokia JSON into Prometheus metrics (queue depth, enqueued, dequeued)
  json-exporter:
    image: prometheuscommunity/json-exporter:v0.6.0
    restart: unless-stopped
    command: ["--config.file=/etc/json-exporter/config.yml"]
    volumes:
      - ./monitoring/json-exporter-config.yml:/etc/json-exporter/config.yml:ro
    ports:
      - "7979:7979"

volumes:
  openmrs-data: ~
  db-data: ~
