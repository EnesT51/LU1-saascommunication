## RabbitMQ TLS configuratie (NFR 5 — TLS 1.3 voor transport)
## Alleen AMQPS op poort 5671, plain AMQP uitgeschakeld

listeners.ssl.default = 5671

ssl_options.cacertfile = /opt/rabbitmq/certs/ca.crt
ssl_options.certfile   = /opt/rabbitmq/certs/server.crt
ssl_options.keyfile    = /opt/rabbitmq/certs/server.key
ssl_options.verify     = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

## Management plugin blijft op plain HTTP (intern Docker netwerk, geen PII)
management.listener.port = 15672
