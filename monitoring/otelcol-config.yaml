receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*

  # Collector's own metrics
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

  # RabbitMQ queue metrics via json-exporter (queue depth, DLQ berichten)
  prometheus/rabbitmq:
    config:
      scrape_configs:
        - job_name: "rabbitmq"
          scrape_interval: 15s
          metrics_path: /probe
          params:
            module: [rabbitmq]
          static_configs:
            - targets:
                - 'http://rabbitmq:15672/api/queues'
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: json-exporter:7979

  # RestAPI Micrometer metrics via /actuator/prometheus
  # Zorgt dat custom counters (notifications_sent_total, notifications_failed_total) in Grafana komen
  prometheus/restapi:
    config:
      scrape_configs:
        - job_name: "restapi"
          scrape_interval: 10s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - "restapi:8081"

  # ActiveMQ queue metrics via json-exporter (queue depth, enqueued, dequeued)
  prometheus/activemq:
    config:
      scrape_configs:
        - job_name: "activemq"
          scrape_interval: 15s
          metrics_path: /probe
          params:
            module: [activemq]
          static_configs:
            - targets:
                - 'http://admin:admin@messagequeue:8161/api/jolokia/read/org.apache.activemq:type=Broker,brokerName=localhost/TotalMessageCount,TotalEnqueueCount,TotalDequeueCount,TotalConsumerCount'
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: json-exporter:7979

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector, prometheus/activemq, prometheus/rabbitmq, prometheus/restapi]
      processors: [batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]
